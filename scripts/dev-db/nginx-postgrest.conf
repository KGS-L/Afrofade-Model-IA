# Gateway dev : expose PostgREST sous le préfixe /rest/v1/ attendu par supabase-js.
# L'header Authorization est retiré : PostgREST sans JWT secret rejette tout
# Bearer ; sans header, chaque requête prend PGRST_DB_ANON_ROLE (service_role
# en dev — BYPASSRLS). Le scoping utilisateur ne s'applique PAS en dev local.
server {
    listen 8080;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /rest/v1 {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
    }

    location / {
        return 404 '{"error":"gateway dev Afrofade : /rest/v1 uniquement"}';
        add_header Content-Type application/json;
    }
}
