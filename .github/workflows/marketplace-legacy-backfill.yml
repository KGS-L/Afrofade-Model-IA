name: Marketplace Legacy Salon Backfill

on:
  push:
    paths:
      - "web/supabase/migrations/20_marketplace_identity_foundation.sql"
      - "web/supabase/migrations/21_marketplace_legacy_salon_backfill.sql"
      - "web/supabase/tests/21_marketplace_legacy_salon_backfill.sql"
      - ".github/workflows/marketplace-legacy-backfill.yml"
  pull_request:
    paths:
      - "web/supabase/migrations/20_marketplace_identity_foundation.sql"
      - "web/supabase/migrations/21_marketplace_legacy_salon_backfill.sql"
      - "web/supabase/tests/21_marketplace_legacy_salon_backfill.sql"
      - ".github/workflows/marketplace-legacy-backfill.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy membership backfill
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f web/supabase/tests/21_marketplace_legacy_salon_backfill.sql
