name: P1 Hair Asset Normalizer

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate-hair-asset-normalizer:
    name: Validate canonical hair normalization pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy~=1.26.0" \
            "trimesh~=4.3.0" \
            "pillow~=10.2.0" \
            "requests~=2.31.0"

      - name: Validate Story 8.3 HairAssetNormalizer
        run: python3 api/scripts/validate_hair_asset_normalizer.py
