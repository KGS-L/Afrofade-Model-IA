name: P1 Hair Asset Versioning

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate-hair-asset-versioning:
    name: Validate versioned CanonicalHairAsset schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic~=2.6.0"

      - name: Validate Story 8.1 hair asset versioning
        run: python3 api/scripts/validate_hair_asset_versioning.py
