name: Marketplace Identity PostgreSQL

on:
  push:
    paths:
      - "web/supabase/migrations/12_marketplace_identity_foundation.sql"
      - "web/supabase/tests/12_marketplace_identity_foundation.sql"
      - ".github/workflows/marketplace-identity-postgres.yml"
  pull_request:
    paths:
      - "web/supabase/migrations/12_marketplace_identity_foundation.sql"
      - "web/supabase/tests/12_marketplace_identity_foundation.sql"
      - ".github/workflows/marketplace-identity-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    name: Run Story 12.1 PostgreSQL contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run migration contract
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -f web/supabase/tests/12_marketplace_identity_foundation.sql
