name: P1 Durable Head Generation

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate-head-generation:
    name: Validate durable HeadGenerationManager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic~=2.6.0" "requests~=2.31.0"

      - name: Validate Story 7.5 durable head generation
        run: python3 api/scripts/validate_head_generation_manager.py

      - name: Validate head asset repository ownership mapping
        run: python3 api/scripts/validate_head_asset_repository.py
