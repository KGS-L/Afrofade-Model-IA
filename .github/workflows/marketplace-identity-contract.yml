name: Marketplace Identity Contract

on:
  push:
    paths:
      - "web/supabase/migrations/12_marketplace_identity_foundation.sql"
      - "scripts/check_marketplace_identity_contract.py"
      - ".github/workflows/marketplace-identity-contract.yml"
  pull_request:
    paths:
      - "web/supabase/migrations/12_marketplace_identity_foundation.sql"
      - "scripts/check_marketplace_identity_contract.py"
      - ".github/workflows/marketplace-identity-contract.yml"

permissions:
  contents: read

jobs:
  validate-marketplace-identity:
    name: Validate Story 12.1 identity migration contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate additive marketplace identity contract
        run: python3 scripts/check_marketplace_identity_contract.py
