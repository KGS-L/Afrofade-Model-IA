name: P1 Head Job Integration

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate-head-job-integration:
    name: Validate durable head job lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic~=2.6.0" \
            "requests~=2.31.0" \
            "numpy~=1.26.0" \
            "trimesh~=4.3.0" \
            "pillow~=10.2.0"

      - name: Validate Story 7.6 end-to-end durable head lifecycle
        run: python3 api/scripts/validate_head_job_integration.py
