name: P1 AssetStorage Layout

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  asset-storage-layout:
    name: Validate private AssetStorage layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic~=2.6.0" "requests~=2.31.0"

      - name: Validate private storage layout
        run: python3 api/scripts/validate_asset_storage_layout.py
