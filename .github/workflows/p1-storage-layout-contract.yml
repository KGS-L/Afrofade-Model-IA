name: P1 AssetStorage Layout

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  asset-storage-layout:
    name: Validate private AssetStorage layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate private storage layout
        run: python3 api/scripts/validate_asset_storage_layout.py
