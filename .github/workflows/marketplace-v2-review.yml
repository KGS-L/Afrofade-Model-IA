name: Marketplace V2 Review

on:
  push:
    branches:
      - agent/bmad-ui-ux-future-marketplace
  pull_request:
    paths:
      - "web/src/**"
      - "web/supabase/migrations/**"
      - "web/supabase/tests/**"
      - "scripts/check_marketplace_v2_contract.py"
      - ".github/workflows/marketplace-v2-review.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate marketplace V2 contracts
        run: python3 scripts/check_marketplace_v2_contract.py

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
