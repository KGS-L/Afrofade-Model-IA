name: P1 TRELLIS2 provider
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r api/requirements.txt
      - run: python3 api/scripts/validate_trellis2_provider.py
      - run: python3 api/scripts/validate_trellis2_handler.py
      - run: python3 api/scripts/validate_trellis2_webhook_route.py
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f web/supabase/tests/12_trellis2_job_checkpoints.sql
      - run: python3 api/scripts/validate_provider_scaffolding.py
      - run: python3 api/scripts/validate_hair_asset_normalizer.py
      - run: python3 api/scripts/validate_worker_lifecycle.py
      - run: python3 api/scripts/validate_asset_storage.py
      - run: python3 -m compileall -q api
