name: Afrofade CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-web:
    name: Build & Validate Web Frontend (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies from committed lockfile
        run: |
          cd web
          npm ci

      - name: TypeScript validation
        run: |
          cd web
          npm run typecheck

      - name: Build Next.js Production Bundle
        run: |
          cd web
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: https://afrofade.pro
          NEXT_PUBLIC_API_URL: https://afrofade.pro/api
          API_INTERNAL_SECRET: ci-internal-secret
          CRON_SECRET: ci-cron-secret

  test-api:
    name: Validate Backend 3D AI Engine (FastAPI & OpenCV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          cd api
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python sources
        run: |
          python -m compileall -q api

      - name: Validate canonical 3D contracts
        run: |
          python3 api/scripts/validate_canonical_contracts.py

      - name: Validate persistent AI JobQueue contract
        run: |
          python3 api/scripts/validate_job_queue_contract.py

      - name: Validate restart-safe AI worker lifecycle
        run: |
          python3 api/scripts/validate_worker_lifecycle.py

      - name: Check P0 security invariants
        run: |
          python3 scripts/check_p0_invariants.py

      - name: Check pre-7.6 product hardening invariants
        run: |
          python3 scripts/check_product_hardening.py

      - name: Check AI Model Downloader & Gatekeeper
        run: |
          python3 api/scripts/download_models.py

  docker-build:
    name: Test Production Docker Compose Build & Security Boundaries
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI runtime env
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_APP_URL=http://127.0.0.1:3005
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8005
          API_INTERNAL_URL=http://api:8000
          WEB_PORT=3005
          API_PORT=8005
          FASTAPI_ENV=production
          SUPABASE_URL=http://postgrest-gateway:8080
          API_INTERNAL_SECRET=ci-internal-secret
          CRON_SECRET=ci-cron-secret
          API_ALLOWED_ORIGINS=http://127.0.0.1:3005
          AI_WORKER_ENABLED=false
          AI_WORKER_CLAIM_LIMIT=1
          AI_WORKER_LEASE_SECONDS=300
          AI_WORKER_HEARTBEAT_SECONDS=60
          AI_WORKER_POLL_SECONDS=2
          POSTGRES_USER=afrofade
          POSTGRES_PASSWORD=afrofade_dev_pass
          POSTGRES_DB=afrofade_dev
          POSTGRES_HOST=afrofade-db
          POSTGRES_PORT=5432
          EOF

      - name: Build production containers only
        run: docker compose -f docker-compose.yml build

      - name: Start production stack
        run: |
          docker compose -f docker-compose.yml up -d
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml exec -T db pg_isready -U afrofade -d afrofade_dev >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "Applying migrations..."
          for f in $(ls web/supabase/migrations/*.sql | sort); do
            docker compose -f docker-compose.yml exec -T db psql -U afrofade -d afrofade_dev -f - < "$f" >/dev/null 2>&1 || true
          done
          echo "Waiting for web and api services..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8005/health >/dev/null \
              && curl -fsS http://127.0.0.1:3005/ >/dev/null \
              && docker compose -f docker-compose.yml ps --status running worker | grep -q afrofade-ai-worker; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Run P0 security smoke tests
        run: TEST_WEB_URL=http://127.0.0.1:3005 TEST_API_URL=http://127.0.0.1:8005 python3 scripts/test_e2e_integration.py

      - name: Run Customer Profile & Salon Onboarding simulation tests
        run: |
          TEST_WEB_URL=http://127.0.0.1:3005 TEST_API_URL=http://127.0.0.1:8005 python3 scripts/test_profile_update.py
          TEST_WEB_URL=http://127.0.0.1:3005 TEST_API_URL=http://127.0.0.1:8005 python3 scripts/test_salon_onboarding.py

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  deploy-vps:
    name: Deploy Afrofade to VPS (projects/Afrofade)
    environment: prod
    runs-on: [self-hosted, Linux, X64]
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Afrofade to VPS project folder
        env:
          VPS_AFROFADE_PATH: ${{ secrets.VPS_AFROFADE_PATH }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
          DOMAIN: "afrofade.pro"
          EMAIL: "contact@afrofade.pro"
        run: |
          TARGET_DIR="${VPS_AFROFADE_PATH:-$HOME/projects/Afrofade}"
          echo "Dossier cible sur le VPS : $TARGET_DIR"
          mkdir -p "$TARGET_DIR/scripts" "$TARGET_DIR/deploy/nginx"
          cp -a docker-compose.yml "$TARGET_DIR/"
          if [ -f .env.example ]; then cp -a .env.example "$TARGET_DIR/"; fi
          cp -a scripts/* "$TARGET_DIR/scripts/"
          cp -a deploy/nginx/* "$TARGET_DIR/deploy/nginx/"
          if [ -d web ]; then
            rsync -a --exclude 'node_modules' --exclude '.next' web/ "$TARGET_DIR/web/" 2>/dev/null || cp -r web "$TARGET_DIR/"
          fi
          if [ -d api ]; then
            rsync -a --exclude '__pycache__' --exclude '.venv' api/ "$TARGET_DIR/api/" 2>/dev/null || cp -r api "$TARGET_DIR/"
          fi
          cd "$TARGET_DIR"

          if [ ! -f .env ]; then
            cp .env.example .env
          else
            while IFS='=' read -r key value || [ -n "$key" ]; do
              [[ "$key" =~ ^#.*$ ]] && continue
              [[ -z "$key" ]] && continue
              clean_key=$(echo "$key" | cut -d'=' -f1 | xargs)
              if ! grep -q "^${clean_key}=" .env; then echo "${key}=${value}" >> .env; fi
            done < .env.example
          fi

          run_sudo() {
            if [ "$EUID" -eq 0 ]; then "$@"; elif [ -n "$VPS_SUDO_PASSWORD" ]; then echo "$VPS_SUDO_PASSWORD" | sudo -S "$@"; else sudo -n "$@"; fi
          }

          bash scripts/ensure-internal-secrets.sh .env

          run_sudo bash scripts/configure-vps-nginx.sh --domain "$DOMAIN" --email "$EMAIL"
          if command -v docker &>/dev/null && docker info &>/dev/null; then
            docker compose -f docker-compose.yml up -d --build
            docker compose -f docker-compose.yml ps
          else
            run_sudo docker compose -f docker-compose.yml up -d --build
            run_sudo docker compose -f docker-compose.yml ps
          fi
