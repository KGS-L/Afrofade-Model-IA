name: Afrofade CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-web:
    name: Build & Validate Web Frontend (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm install

      - name: Build Next.js Production Bundle
        run: |
          cd web
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: https://afrofade.pro
          NEXT_PUBLIC_API_URL: https://afrofade.pro/api
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  test-api:
    name: Validate Backend 3D AI Engine (FastAPI & OpenCV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          cd api
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check AI Model Downloader & Gatekeeper
        run: |
          python3 api/scripts/download_models.py

  docker-build:
    name: Test Docker Compose Multi-Stage Build
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Containers
        run: |
          docker compose build

  deploy-vps:
    name: Deploy Afrofade to VPS (project/Afrofade)
    runs-on: [self-hosted, Linux, X64]
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Afrofade to VPS project folder
        env:
          VPS_AFROFADE_PATH: ${{ secrets.VPS_AFROFADE_PATH }}
          DOMAIN: "afrofade.pro"
          EMAIL: "contact@afrofade.pro"
        run: |
          TARGET_DIR="${VPS_AFROFADE_PATH:-$HOME/project/Afrofade}"
          echo "Dossier cible sur le VPS : $TARGET_DIR"
          
          mkdir -p "$TARGET_DIR/scripts" "$TARGET_DIR/deploy/nginx"
          
          cp -a docker-compose.yml "$TARGET_DIR/"
          if [ -f .env.example ]; then
            cp -a .env.example "$TARGET_DIR/"
          fi
          cp -a scripts/* "$TARGET_DIR/scripts/"
          cp -a deploy/nginx/* "$TARGET_DIR/deploy/nginx/"
          
          if [ -d web ]; then
            rsync -a --exclude 'node_modules' --exclude '.next' web/ "$TARGET_DIR/web/" 2>/dev/null || cp -r web "$TARGET_DIR/"
          fi
          if [ -d api ]; then
            rsync -a --exclude '__pycache__' --exclude '.venv' api/ "$TARGET_DIR/api/" 2>/dev/null || cp -r api "$TARGET_DIR/"
          fi
          
          cd "$TARGET_DIR"
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          
          # Verification DNS et Configuration Nginx / Certbot SSL
          if [ "$EUID" -eq 0 ]; then
            bash scripts/configure-vps-nginx.sh --domain "$DOMAIN" --email "$EMAIL"
          else
            sudo bash scripts/configure-vps-nginx.sh --domain "$DOMAIN" --email "$EMAIL"
          fi
          
          # Démarrage des conteneurs
          docker compose up -d --build
          docker compose ps
