version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: afrofade-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://afrofade.pro}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MONEY_FUSION_URL=${MONEY_FUSION_URL:-https://www.moneyfusion.net/api/v1/pay}
      - MONEY_FUSION_API_KEY=${MONEY_FUSION_API_KEY}
    networks:
      - afrofade-network

networks:
  afrofade-network:
    driver: bridge
