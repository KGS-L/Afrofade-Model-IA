services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: afrofade-web
    restart: always
    ports:
      - "127.0.0.1:${WEB_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://afrofade.pro}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.afrofade.pro}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8000}
      - API_INTERNAL_SECRET=${API_INTERNAL_SECRET}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - MONEY_FUSION_URL=${MONEY_FUSION_URL:-https://www.moneyfusion.net/api/v1/pay}
      - MONEY_FUSION_API_KEY=${MONEY_FUSION_API_KEY}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
    networks:
      - afrofade-network
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: afrofade-api-3d
    restart: always
    ports:
      - "127.0.0.1:${API_PORT:-8005}:8000"
    environment:
      - PORT=8000
      - FASTAPI_ENV=production
      - API_INTERNAL_SECRET=${API_INTERNAL_SECRET}
      - API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS:-https://afrofade.pro}
    networks:
      - afrofade-network

networks:
  afrofade-network:
    driver: bridge
