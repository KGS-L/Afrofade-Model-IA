services:
  db:
    image: postgres:16-alpine
    container_name: afrofade-db
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrofade} -d ${POSTGRES_DB:-afrofade_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - afrofade-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://afrofade.pro}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.afrofade.pro}
    container_name: afrofade-web
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - afrofade-network
    depends_on:
      - db
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: afrofade-api-3d
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8005}:8000"
    volumes:
      - afrofade-generated-models:/tmp/generated_models
    networks:
      - afrofade-network
    depends_on:
      - db

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: afrofade-ai-worker
    restart: always
    command: ["python", "-m", "workers.job_worker"]
    env_file:
      - .env
    volumes:
      - afrofade-generated-models:/tmp/generated_models
    networks:
      - afrofade-network
    depends_on:
      - db

networks:
  afrofade-network:
    driver: bridge

volumes:
  postgres-data:
  afrofade-generated-models:
