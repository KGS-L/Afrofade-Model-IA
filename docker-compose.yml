version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: afrofade-web
    restart: always
    ports:
      - "${WEB_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://afrofade.pro}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8005}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MONEY_FUSION_URL=${MONEY_FUSION_URL:-https://www.moneyfusion.net/api/v1/pay}
      - MONEY_FUSION_API_KEY=${MONEY_FUSION_API_KEY}
    networks:
      - afrofade-network
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: afrofade-api-3d
    restart: always
    ports:
      - "${API_PORT:-8005}:8000"
    environment:
      - PORT=8000
      - FASTAPI_ENV=production
    networks:
      - afrofade-network

networks:
  afrofade-network:
    driver: bridge
